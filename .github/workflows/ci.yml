name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          shellcheck --version
          bash --version | head -1

      - name: Lint (bash -n, shellcheck, systemd-analyze verify)
        run: tests/lint.sh

      - name: Tests
        run: tests/run.sh

  arch:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      # Reap orphaned test victims so kill -0 does not see lingering zombies.
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools
        run: |
          pacman -Syu --needed --noconfirm git shellcheck systemd procps-ng util-linux gawk sed diffutils shadow
          shellcheck --version
          bash --version | head -1

      - uses: actions/checkout@v4

      - name: Lint (bash -n, shellcheck, systemd-analyze verify)
        run: tests/lint.sh

      - name: Tests (unprivileged)
        run: |
          useradd -m watchdog-test
          chmod -R a+rX .
          runuser -u watchdog-test -- bash tests/run.sh

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas
        run: |
          command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          shellcheck --version
          bash --version | head -1

      - name: Lint (bash -n, shellcheck, systemd-analyze verify)
        run: tests/lint.sh

      - name: Testes
        run: tests/run.sh
